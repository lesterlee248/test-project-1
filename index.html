<!DOCTYPE html>
<html>
<head>
    <title>My Colorful Website</title>
    <style>
        body {
            background-color: #f0f8ff; /* Alice Blue background */
            font-family: 'Segoe UI', sans-serif;
            text-align: center; /* Centers all text */
            padding-top: 50px;
        }
        h1 {
            color: #2e8b57; /* Sea Green color */
            font-size: 3rem;
        }
        p {
            color: #333333;
            font-size: 1.2rem;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2e8b57;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background-color: #1e613b;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>
    <p>I just added CSS styles to change the colors and layout.</p>
    
    <!-- This link will point to your second page -->
    <a href="about.html">About Me</a>

</body>
</html>
