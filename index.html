    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Professional Website</title>
  
  <style>
    /* Global Base Styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      color: #0f172a;
    }

    p {
      font-size: 1.1rem;
      color: #334155;
    }

    /* Premium Navigation Bar Container */
    .navigation-bar {
      padding: 20px 24px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-start;
    }

    /* The Dropdown Wrapper */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* The interactive trigger button */
    .dropbtn {
      background-color: #1e293b; /* Sleek dark slate color */
      color: #f8fafc;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    /* Clean Vector Chevron Arrow Icon */
    .dropdown-chevron {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    /* The Dropdown Menu Card (Hidden by default, slides down smoothly) */
    .dropdown-content {
      display: block;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      position: absolute;
      background-color: #ffffff;
      min-width: 240px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      z-index: 10;
      border-radius: 8px;
      margin-top: 6px;
      overflow: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    /* Navigation Menu Option Links */
    .dropdown-content a {
      color: #334155;
      padding: 12px 16px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background-color 0.15s ease;
    }

    /* Bold Primary Text Inside Links */
    .dropdown-content a strong {
      font-size: 14px;
      color: #0f172a;
    }

    /* Soft Subtitle Descriptions Inside Links */
    .dropdown-content a span {
      font-size: 12px;
      color: #64748b;
    }

    /* Hover effect for layout links */
    .dropdown-content a:hover {
      background-color: #f1f5f9;
    }

    /* Dynamic Activation Trigger: Gathers fade and slide states smoothly */
    .dropdown:hover .dropdown-content {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* Subtle trigger background switch and arrow inversion on hover */
    .dropdown:hover .dropbtn {
      background-color: #0f172a;
    }
    .dropdown:hover .dropdown-chevron {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header containing the Dropdown Menu -->
  <nav class="navigation-bar">
    <div class="dropdown">
      <div class="dropbtn">
        <span>Menu</span>
        <svg class="dropdown-chevron" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="dropdown-content">
        <a href="index.html">
          <strong>Home</strong>
          <span>Go back to the homepage</span>
        </a>
        <a href="about.html">
          <strong>About Me</strong>
          <span>Learn more about my background</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Website Content Section -->
  <main class="container">
    <h1>Welcome to My Modern Website</h1>
    <p>This is my first website hosted live on GitHub Pages. Use the navigation menu at the top left to browse through the different pages on this site.</p>
  </main>

</body>
</html>
